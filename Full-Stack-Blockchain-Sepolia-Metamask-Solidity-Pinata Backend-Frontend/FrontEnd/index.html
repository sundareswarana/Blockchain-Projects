<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Employee Management DApp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Employee Management DApp</h1>

        <button id="connectButton">
            Connect MetaMask
        </button>

        <p id="walletStatus">
            Wallet not connected
        </p>

        <hr>

        <h2>Register Employee</h2>

        <form id="employeeForm">

            <label>Employee ID</label>
            <input
                type="text"
                id="employeeId"
                placeholder="EMP001"
                required
            >

            <label>Employee Name</label>
            <input
                type="text"
                id="employeeName"
                placeholder="Sundareswaran"
                required
            >

            <label>Designation</label>
            <input
                type="text"
                id="designation"
                placeholder="Associate Professor"
                required
            >

            <label>Salary</label>
            <input
                type="text"
                id="salary"
                placeholder="8.5 LPA"
                required
            >

            <label>Location</label>
            <input
                type="text"
                id="location"
                placeholder="Chennai"
                required
            >

            <label>Employee Photo</label>
            <input
                type="file"
                id="photo"
                accept="image/*"
                required
            >

            <button type="submit">
                Register Employee
            </button>

        </form>

        <p id="status"></p>

        <hr>

        <h2>Search Employee</h2>

        <input
            type="text"
            id="searchEmployeeId"
            placeholder="Enter Employee ID"
        >

        <button id="getEmployeeButton">
            Get Employee
        </button>

        <div id="employeeResult"></div>

    </div>


    <!-- Ethers.js v6 -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

    <!-- Smart Contract configuration -->
    <script src="contract.js"></script>

    <!-- Application logic -->
    <script src="app.js"></script>

</body>

</html>
